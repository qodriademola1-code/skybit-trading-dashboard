<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance | Skybit Enterprise</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="dash-top-nav">
        <div class="brand-link">
            <div class="brand-text"> SKYBIT <span class="brand-accent">FINANCE</span> </div>
        </div>
        <ul class="dash-links">
            <li><a href="dashboard.html">Trade</a></li>
            <li><a href="finance.html" class="active">Wallet</a></li>
<li><a href="#" class="logout-text" onclick="logout()">Logout</a></li>
        </ul>
    </nav>

    <main class="main-content-fluid">
        <div class="auth-form purple-glass-auth" style="max-width: 500px; margin: 0 auto;">
            <p style="font-weight: 800; color: #6b7280; text-transform: uppercase; font-size: 0.7rem;">Total Balance</p>
            <h1 style="font-size: 2.5rem; font-weight: 900; color: #2563eb; margin-bottom: 20px;">₦<span id="user-balance">0.00</span></h1>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                <button class="btn-main" onclick="openWithdrawal()" style="background: #10b981;">Withdraw</button>
                <button class="btn-main" onclick="location.href='dashboard.html'" style="background: #9333ea;">Add Funds</button>
            </div>

            <div id="withdrawal-box" class="purple-glass-auth" style="display: none; padding: 20px; border-radius: 15px; margin-top: 20px; text-align: left;">
    <h3 style="font-weight: 900; margin-bottom: 15px;">Withdraw Funds</h3>
    
    <!-- Bank Selection -->
    <label style="font-size: 0.7rem; font-weight: 800; color: #6b7280;">CHOOSE BANK</label>
    <select id="saved-bank-selector" class="dash-input" style="margin-bottom: 15px; width: 100%;">
        <option value="">-- Select Saved Bank --</option>
    </select>
    
    <button onclick="toggleBankForm()" style="background: none; border: none; color: #9333ea; font-size: 0.75rem; font-weight: 800; cursor: pointer; margin-bottom: 15px;">+ Add New Bank Account</button>

    <!-- New Bank Form (Hidden by default) -->
    <!-- Inside new-bank-form in finance.html -->
<div id="new-bank-form" style="display: none; background: rgba(0,0,0,0.03); padding: 15px; border-radius: 10px; margin-bottom: 15px;">
    <!-- Added Name Field -->
    <input type="text" id="new-acc-name" class="dash-input" placeholder="Account Holder Name" style="margin-bottom: 10px; width: 100%;">
    
    <input type="text" id="new-acc-num" class="dash-input" placeholder="Account Number" style="margin-bottom: 10px; width: 100%;">
    
    <select id="new-bank-name" class="dash-input" style="margin-bottom: 10px; width: 100%;">
        <option>Select Bank</option>
        <option>GTBank</option>
        <option>Zenith Bank</option>
        <option>Kuda MFB</option>
        <option>Opay</option>
    </select>
    <button class="btn-main" onclick="saveNewBank()" style="width: 100%; font-size: 0.8rem; padding: 8px;">Save Account</button>
</div>


    <label style="font-size: 0.7rem; font-weight: 800; color: #6b7280;">AMOUNT</label>
    <input type="number" id="withdraw-amount" class="dash-input" placeholder="Amount to Withdraw" style="width: 100%; margin-bottom: 20px;">
    
<button class="btn-main" type="button" onclick="submitWithdrawalRequest()">Request Withdrawal</button>
</div>
        </div>
    </main>
    <script src="script.js"></script>
